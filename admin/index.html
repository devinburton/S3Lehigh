<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 Contractor Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
:root{--navy:#0b2f50;--blue:#135b91;--bg:#f4f6f8;--border:#dfe5ea;--text:#263747;--muted:#6d7d8b;--danger:#a82c2c;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:30px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{margin:0;color:var(--navy);font-size:28px}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.login{max-width:460px;margin:70px auto}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #cfd7df;border-radius:7px;font-size:14px}
button{border:0;border-radius:7px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--navy);color:#fff}
.secondary{background:#edf2f6;color:var(--navy)}
.danger{background:#fff0f0;color:var(--danger);border:1px solid #efcaca}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.msg{margin-top:12px;font-size:13px;color:var(--muted)}
.error{color:#a82c2c}
.success{color:#167047}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.contractor{display:grid;grid-template-columns:1fr auto;gap:15px;padding:15px 0;border-bottom:1px solid #edf0f3}
.contractor:last-child{border-bottom:0}
.contractor strong{color:var(--navy)}
.meta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:5px}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;background:#edf4f9;color:var(--blue);padding:4px 7px;border-radius:999px;margin-top:6px}
.notice{background:#fff8df;border:1px solid #f0dda0;padding:13px;border-radius:8px;font-size:12px;line-height:1.5;margin-bottom:14px}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .contractor{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">

<section id="loginPanel" class="panel login">
  <h1>S3 Contractor Admin</h1>
  <div class="sub">Private management page. Sign in with one of the approved Supabase accounts.</div>
  <label>Email</label>
  <input id="loginEmail" type="email" autocomplete="username">
  <label>Password</label>
  <input id="loginPassword" type="password" autocomplete="current-password">
  <div class="actions" style="margin-top:16px">
    <button class="primary" id="loginBtn">Sign in</button>
  </div>
  <div id="loginMsg" class="msg"></div>
</section>

<section id="app" class="hidden">
  <div class="top">
    <div>
      <h1>S3 Contractor Admin</h1>
      <div class="sub" id="signedInAs"></div>
    </div>
    <button class="secondary" id="logoutBtn">Sign out</button>
  </div>

  <div class="panel" id="membersPanel">
    <h2 style="margin-top:0;color:var(--navy)">Member access requests</h2>
    <p class="sub">Approve requests to grant directory access, or revoke existing access. Administrator roles are managed separately.</p>
    <button id="refreshMembers" class="secondary">Refresh requests</button>
    <div id="membersMessage" class="msg" role="status"></div><div id="membersList"></div>
  </div>
  <div class="panel">
    <h2 id="formTitle" style="margin-top:0;color:var(--navy)">Add Contractor</h2>
    <form id="contractorForm">
      <input type="hidden" id="editId">
      <div class="grid">
        <div>
          <label>Name</label>
          <input id="name" required>
        </div>
        <div>
          <label>Category</label>
          <select id="category">
            <option value="cleaning">Cleaning</option>
            <option value="construction">Construction</option>
            <option value="demolition">Demolition</option>
            <option value="electrical">Electrical</option>
            <option value="landscaping">Landscaping</option>
            <option value="handyman">Handyman</option>
            <option value="other">Other / Not Listed</option>
          </select>
        </div>
        <div class="full">
          <label>Address</label>
          <input id="address">
        </div>
        <div>
          <label>Phone</label>
          <input id="phone">
        </div>
        <div>
          <label>Email</label>
          <input id="email" type="text" placeholder="email@example.com">
        </div>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="primary" type="submit" id="saveBtn">Add Contractor</button>
        <button class="secondary hidden" type="button" id="cancelEditBtn">Cancel edit</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </form>
  </div>

  <div class="panel">
    <div class="top" style="margin-bottom:10px">
      <div>
        <h2 style="margin:0;color:var(--navy)">Contractors</h2>
        <div class="sub" id="countText"></div>
      </div>
    </div>
    <div id="contractorList"></div>
  </div>
</section>

</div>

<script>

const client = window.supabase.createClient(
  window.S3_CONFIG.SUPABASE_URL,
  window.S3_CONFIG.SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);
const clean = v => String(v ?? "").trim();

function setMessage(el, text, kind=""){
  el.textContent = text || "";
  el.className = "msg " + kind;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function labelCategory(c){
  return {
    cleaning:"Cleaning",
    construction:"Construction",
    demolition:"Demolition",
    electrical:"Electrical",
    landscaping:"Landscaping",
    handyman:"Handyman",
    other:"Other / Not Listed"
  }[c] || c || "Other";
}

let adminGeneration = 0;
async function refreshSession(){
  const generation = ++adminGeneration;
  $("app").classList.add("hidden");
  $("contractorList").replaceChildren();
  $("membersList").replaceChildren();
  const { data } = await client.auth.getSession();
  const session = data?.session;

  if(generation !== adminGeneration) return;
  if(!session){
    $("loginPanel").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }

  const membership = await client.from("directory_members").select("role,status").eq("user_id",session.user.id).maybeSingle();
  if(generation !== adminGeneration) return;
  if(membership.error || membership.data?.role !== "admin" || membership.data?.status !== "approved"){
    $("loginPanel").classList.remove("hidden");
    setMessage($("loginMsg"),"An approved administrator account is required.","error");
    return;
  }
  $("loginPanel").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("signedInAs").textContent = "Signed in as " + session.user.email;
  await Promise.all([loadContractors(),loadMembers()]);
}

async function loadContractors(){
  const { data, error } = await client
    .from("Contractors")
    .select("id,name,address,phone,email,category")
    .order("name", { ascending:true });

  if(error){
    $("contractorList").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    return;
  }

  const rows = data || [];

  const contractors = rows.filter(r => r.name !== "__S3_INITIALIZED__");


  $("countText").textContent = contractors.length + (contractors.length === 1 ? " contractor" : " contractors");

  if(!contractors.length){
    $("contractorList").innerHTML = '<div class="sub">No contractors in the database yet.</div>';
    return;
  }

  $("contractorList").innerHTML = contractors.map(r => `
    <div class="contractor">
      <div>
        <strong>${escapeHtml(r.name)}</strong>
        <div class="badge">${escapeHtml(labelCategory(r.category))}</div>
        <div class="meta">
          ${r.address ? escapeHtml(r.address)+"<br>" : ""}
          ${r.phone ? escapeHtml(r.phone)+"<br>" : ""}
          ${r.email ? escapeHtml(r.email) : ""}
        </div>
      </div>
      <div class="actions">
        <button class="secondary" data-edit="${escapeHtml(r.id)}">Edit</button>
        <button class="danger" onclick="deleteContractor(${Number(r.id)})">Delete</button>
      </div>
    </div>
  `).join("");
  $("contractorList").querySelectorAll("[data-edit]").forEach(button=>button.addEventListener("click",()=>editContractor(contractors.find(r=>String(r.id)===button.dataset.edit))));
}

window.editContractor = function(r){
  $("editId").value = r.id;
  $("name").value = r.name || "";
  $("address").value = r.address || "";
  $("phone").value = r.phone || "";
  $("email").value = r.email || "";
  $("category").value = r.category || "other";
  $("formTitle").textContent = "Edit Contractor";
  $("saveBtn").textContent = "Save Changes";
  $("cancelEditBtn").classList.remove("hidden");
  setMessage($("formMsg"), "");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  $("contractorForm").reset();
  $("editId").value = "";
  $("category").value = "cleaning";
  $("formTitle").textContent = "Add Contractor";
  $("saveBtn").textContent = "Add Contractor";
  $("cancelEditBtn").classList.add("hidden");
}

window.deleteContractor = async function(id){
  if(!confirm("Delete this contractor?")) return;
  const { error } = await client.from("Contractors").delete().eq("id", id);
  if(error) alert(error.message);
  else await loadContractors();
}

$("loginBtn").addEventListener("click", async ()=>{
  setMessage($("loginMsg"), "Signing in...");
  const email = clean($("loginEmail").value);
  const password = $("loginPassword").value;
  const { error } = await client.auth.signInWithPassword({ email, password });
  if(error){
    setMessage($("loginMsg"), error.message, "error");
    return;
  }
  $("loginPassword").value = "";
  setMessage($("loginMsg"), "");
  await refreshSession();
});

$("logoutBtn").addEventListener("click", async ()=>{
  await client.auth.signOut();
  await refreshSession();
});

$("cancelEditBtn").addEventListener("click", ()=>resetForm());

$("contractorForm").addEventListener("submit", async e=>{
  e.preventDefault();
  setMessage($("formMsg"), "Saving...");

  const payload = {
    name: clean($("name").value),
    address: clean($("address").value),
    phone: clean($("phone").value),
    email: clean($("email").value),
    category: $("category").value
  };

  const id = clean($("editId").value);
  let result;

  if(id){
    result = await client.from("Contractors").update(payload).eq("id", Number(id));
  }else{
    result = await client.from("Contractors").insert(payload);
  }

  if(result.error){
    setMessage($("formMsg"), result.error.message, "error");
    return;
  }

  setMessage($("formMsg"), id ? "Contractor updated." : "Contractor added.", "success");
  resetForm();
  await loadContractors();
});

async function loadMembers(){
  const {data,error}=await client.from("directory_members").select("user_id,email,full_name,organization,status,role,created_at").order("created_at",{ascending:false});
  if(error){setMessage($("membersMessage"),"Unable to load requests: "+error.message,"error");return;}
  const members=(data||[]).filter(m=>m.role!=="admin");
  $("membersList").innerHTML=members.map(m=>`<div class="contractor"><div><strong>${escapeHtml(m.full_name||m.email)}</strong><div class="meta">${escapeHtml(m.email)}<br>${escapeHtml(m.organization)}</div><span class="badge">${escapeHtml(m.status)}</span></div><div class="actions">${m.status!=="approved" ? `<button class="primary" data-user="${escapeHtml(m.user_id)}" data-status="approved">Approve</button>` : ""}${m.status!=="revoked" ? `<button class="danger" data-user="${escapeHtml(m.user_id)}" data-status="revoked">Revoke</button>` : ""}</div></div>`).join("") || '<p class="sub">No member requests yet.</p>';
  $("membersList").querySelectorAll("[data-user]").forEach(button=>button.addEventListener("click",async()=>{
    button.disabled=true;
    try{
      const {data,error}=await client.from("directory_members").update({status:button.dataset.status}).eq("user_id",button.dataset.user).select("user_id");
      if(error || !data?.length) throw error || new Error("Access was not changed. Check your administrator permissions.");
      setMessage($("membersMessage"),button.dataset.status==="approved" ? "Member approved." : "Member access revoked.","success");
      await loadMembers();
    }catch(error){setMessage($("membersMessage"),error.message,"error");button.disabled=false;}
  }));
}
$("refreshMembers").addEventListener("click",loadMembers);
client.auth.onAuthStateChange(()=>{++adminGeneration;$("app").classList.add("hidden");$("contractorList").replaceChildren();$("membersList").replaceChildren();setTimeout(refreshSession,0);});
refreshSession();
</script>
</body>
</html>
